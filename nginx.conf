server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Прокси к API «Проценки»: браузер ходит на тот же домен по /api/...,
  # поэтому не нужны CORS и нет проблем со смешанным контентом (http/https).
  # /api/hs/hsprice/?key=... -> https://api.favorit-parts.ru/hs/hsprice/?key=...
  location /api/ {
    proxy_pass https://api.favorit-parts.ru/;
    proxy_http_version 1.1;
    proxy_set_header Host api.favorit-parts.ru;
    proxy_ssl_server_name on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
  }

  # Файлы в /assets/ имеют хэш в имени, их можно кэшировать надолго.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # index.html не кэшируем: после выпуска новой версии он сразу ссылается на новые файлы.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri /index.html;
  }
}
